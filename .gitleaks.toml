title = "ZeroClaw gitleaks configuration"

[extend]
useDefault = true

# Path-only allowlists for intentional detector fixtures / docs placeholders.
# Do not embed fixture secret literals here; GitHub push protection treats those
# strings as real secrets even inside allowlist config.
#
# Tip fixtures that previously needed path allowlists are now silenced with
# inline `gitleaks:allow` or `concat!` splits (approval, anthropic beta header,
# gateway, web_fetch, amqp, config secrets).
[[allowlists]]
description = "Known false positives in detector fixtures, docs placeholders, and example snippets"
paths = [
  '''(?:^|/)crates/zeroclaw-runtime/src/security/leak_detector\.rs$''',
  '''(?:^|/)crates/zeroclaw-runtime/src/agent/turn/redact\.rs$''',
  '''(?:^|/)crates/zeroclaw-runtime/src/agent/loop_\.rs$''',
  '''(?:^|/)crates/zeroclaw-runtime/src/sop/executor\.rs$''',
  '''(?:^|/)crates/zeroclaw-channels/src/orchestrator/mod\.rs$''',
  '''(?:^|/)src/security/leak_detector\.rs$''',
  '''(?:^|/)src/security/secrets\.rs$''',
  '''(?:^|/)tests/component/security\.rs$''',
  '''(?:^|/)extensions/movie/src/.+\.rs$''',
  '''(?:^|/)docs/(?:i18n/vi/|vi/)?zai-glm-setup\.md$''',
  '''(?:^|/)docs/superpowers/specs/2026-03-13-linkedin-tool-design\.md$''',
  '''(?:^|/)\.github/workflows/pub-release\.yml$''',
  '''(?:^|/)\.gitleaks\.toml$''',
]
regexes = [
  '''Authorization: Bearer \$\{[^}]+\}''',
  '''curl -sS -o /tmp/ghcr-release-manifest\.json -w "%\{http_code\}"''',
]
