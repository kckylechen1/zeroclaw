[package]
name = "zeroclaw-legacy-kernel-fixture"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "generate-legacy-kernel-fixture"
path = "generate.rs"

[dependencies]
anyhow = "1"
memcore = { git = "https://github.com/kckylechen1/memcore.git", rev = "eba0c48617e8820831bfd22f91d269c6d70f409f", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
