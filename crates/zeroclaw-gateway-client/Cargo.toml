[package]
name = "zeroclaw-gateway-client"
description = "Thin client for the ZeroClaw gateway chat WebSocket"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Transport and wire types only: no runtime, memory, provider, channel or
# tool crates, so a bridge or CLI built on it stays small.
[dependencies]
anyhow = "1.0"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tokio = { version = "1.50", default-features = false, features = ["net"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
uuid = { version = "1.22", default-features = false, features = ["v4", "std"] }

[dev-dependencies]
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "net"] }
