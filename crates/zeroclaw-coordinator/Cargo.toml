[package]
name = "zeroclaw-coordinator"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

# NOT `license.workspace = true`. The workspace is "MIT OR Apache-2.0"; this
# crate contains code derived from grok-build (Apache-2.0), which cannot be
# offered under the MIT arm. Inheriting the workspace license would silently
# relicense that code. See LICENSE and NOTICE in this directory.
license = "Apache-2.0"

description = "Single-writer subagent lifecycle coordinator. Derived from grok-build (Apache-2.0)."

[dependencies]
# Versions are spelled out per-crate here, matching every other crate in this
# workspace — the root `[workspace.dependencies]` table carries only the
# zeroclaw-* path deps, not third-party ones.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
tokio = { version = "1.50", default-features = false, features = [
  "sync",
  "time",
  "rt",
  "macros",
] }
tokio-util = { version = "0.7", default-features = false }

[dev-dependencies]
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "test-util", "time", "sync"] }
