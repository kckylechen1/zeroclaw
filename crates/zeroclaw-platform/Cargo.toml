[package]
name = "zeroclaw-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native and Docker command execution adapters for ZeroClaw."
publish = false

[dependencies]
zeroclaw-api.workspace = true
zeroclaw-config.workspace = true
anyhow = "1.0"
directories = "6.0"
tokio = { version = "1.50", default-features = false, features = ["process"] }

[dev-dependencies]
tempfile = "3.26"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros"] }
toml = "1.0"
