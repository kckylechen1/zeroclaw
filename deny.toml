[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Exact revisions are pinned in zeroclaw-memory/Cargo.toml (Tachi),
# zeroclaw-tools/Cargo.toml (async-imap) and root Cargo.toml (tungstenite).
allow-git = [
    "https://github.com/kckylechen1/Tachi",
    "https://github.com/chatmail/async-imap",
    "https://github.com/snapview/tungstenite-rs",
]
