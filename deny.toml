# cargo-deny configuration -- v2 schema
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# In v2, vulnerability advisories always emit errors (not configurable).
# unmaintained: scope of unmaintained-crate checks (all | workspace | transitive | none)
unmaintained = "all"
# yanked: deny | warn | allow
yanked = "deny"
# Retained consumer: email-tools -> async-imap 0.11.3 -> pin-utils 0.1.0.
# The checked async-imap 0.12.0 release also depends on pin-utils.
# Track replacement in https://github.com/kckylechen1/zeroclaw/issues/432
# and https://github.com/kckylechen1/zeroclaw/issues/647.
ignore = [
    { id = "RUSTSEC-2026-0441", reason = "pin-utils 0.1.0 unmaintained; retained email-tools -> async-imap 0.11.3; checked async-imap 0.12.0 still depends on pin-utils; tracking #432/#647" },
]

[licenses]
# All licenses are denied unless explicitly allowed
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
]
unused-allowed-license = "allow"

# ADR-017 section 6 accepts the optional memory-tachi build and its AGPL
# distribution boundary. The three AGPL packages share the Tachi source pinned
# in zeroclaw-memory/Cargo.toml; no license is added to the global allowlist.
# dependency_policy_smoke.py rejects these AGPL packages in the default graph.
# Re-review the exception when a package version or the Tachi pin changes.
# borrow-or-share is the reviewed MIT No Attribution dependency reached through
# memcore -> jsonschema -> referencing -> fluent-uri (tracking #432/#647).
exceptions = [
    { name = "memcore", version = "=2.0.0", allow = ["AGPL-3.0-only"] },
    { name = "portable-kernel", version = "=1.9.0", allow = ["AGPL-3.0-only"] },
    { name = "vault-kit", version = "=0.1.0", allow = ["AGPL-3.0-only"] },
    { name = "borrow-or-share", version = "=0.2.4", allow = ["MIT-0"] },
]

[bans]
# Reject multiple versions of the same crate in the resolved dependency graph.
# This prevents silent version splits that inflate compile times, binary size,
# and the advisory surface. Existing duplicates are explicitly skipped below;
# remove skips as dependency bumps resolve them.
multiple-versions = "deny"
wildcards = "deny"

# Reviewed exceptions for specific transitive versions in the selected graph.
# A skip removes that version from the multiple-versions check; it does not
# designate another version as canonical or necessarily skip the oldest one.
# Remove exceptions when the owning dependency no longer needs them. Unlisted
# duplicates fail only when reached by the graph selected for the check.

[[bans.skip]]
name = "async-channel"
version = "=1.9.0"

[[bans.skip]]
name = "chacha20"
version = "=0.9.1"

[[bans.skip]]
name = "cpufeatures"
version = "=0.2.17"

[[bans.skip]]
name = "event-listener"
version = "=2.5.3"

[[bans.skip]]
name = "getrandom"
version = "=0.2.17"

[[bans.skip]]
name = "getrandom"
version = "=0.3.4"

[[bans.skip]]
name = "hashbrown"
version = "=0.16.1"

[[bans.skip]]
name = "base64"
version = "=0.23.1"

[[bans.skip]]
name = "rand"
version = "=0.8.6"
# Optional memory-tachi -> portable-kernel -> memcore -> vault-kit requires 0.8.
# Keep its cryptographic nonce/salt consumer until the owning Tachi migration;
# this exact duplicate exception does not suppress advisory checks (#432/#647).
# The default-graph guard also rejects this optional legacy RNG pair.

[[bans.skip]]
name = "rand"
version = "=0.9.4"

[[bans.skip]]
name = "rand_chacha"
version = "=0.3.1"
# Selected by the same vault-kit -> rand 0.8.6 chain; retire with that constraint.

