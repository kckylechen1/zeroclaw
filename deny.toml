[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Optional portable kernel and its internal crates share this immutable source;
# the exact revision is pinned in zeroclaw-memory/Cargo.toml.
allow-git = ["https://github.com/kckylechen1/Tachi"]
