[package]
name = "zeroclaw-bridge-telegram"
description = "Telegram bridge that attaches to the ZeroClaw gateway's chat socket"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "zeroclaw-bridge-telegram"
path = "src/main.rs"

# A bridge is a gateway client: the chat socket client, an HTTP client for
# the Bot API, and the workspace log/spawn macros. No runtime, provider,
# memory or channel crates.
[dependencies]
zeroclaw-gateway-client.workspace = true
zeroclaw-log.workspace = true
zeroclaw-spawn.workspace = true
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
