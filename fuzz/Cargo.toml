[package]
name = "zeroclaw-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Keep the development harness outside the application workspace.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
zeroclaw-config = { path = "../crates/zeroclaw-config", default-features = false }

[[bin]]
name = "fuzz_command_validation"
path = "fuzz_targets/fuzz_command_validation.rs"
test = false
doc = false
