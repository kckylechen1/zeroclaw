[workspace]
members = [".", "crates/zeroclaw-api", "crates/zeroclaw-infra", "crates/zeroclaw-config", "crates/zeroclaw-schema-markdown", "crates/zeroclaw-cost", "crates/zeroclaw-http", "crates/zeroclaw-platform", "crates/zeroclaw-policy", "crates/zeroclaw-log", "crates/zeroclaw-spawn", "crates/zeroclaw-commands", "crates/zeroclaw-providers", "crates/zeroclaw-memory", "crates/zeroclaw-channels", "crates/zeroclaw-tools", "crates/zeroclaw-sop-graph", "crates/zeroclaw-runtime", "crates/zeroclaw-eval", "crates/zeroclaw-gateway", "crates/zeroclaw-gateway-client", "crates/zeroclaw-yonbo-node", "bridges/telegram", "crates/zeroclaw-tool-call-parser", "crates/zeroclaw-macros", "tools/fill-translations", "xtask"]
resolver = "2"

[workspace.package]
version = "0.8.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zeroclaw-labs/zeroclaw"
rust-version = "1.96.1"

[workspace.dependencies]
zeroclaw-schema-markdown = { path = "crates/zeroclaw-schema-markdown", version = "0.8.3" }
zeroclaw-cost = { path = "crates/zeroclaw-cost", version = "0.8.3" }
zeroclaw-platform = { path = "crates/zeroclaw-platform", version = "0.8.3" }
zeroclaw-http = { path = "crates/zeroclaw-http", version = "0.8.3" }
zeroclaw-api = { path = "crates/zeroclaw-api", version = "0.8.3" }
zeroclaw-infra = { path = "crates/zeroclaw-infra", version = "0.8.3" }
zeroclaw-config = { path = "crates/zeroclaw-config", version = "0.8.3", default-features = false }
zeroclaw-log = { path = "crates/zeroclaw-log", version = "0.8.3" }
zeroclaw-spawn = { path = "crates/zeroclaw-spawn", version = "0.8.3" }
zeroclaw-commands = { path = "crates/zeroclaw-commands", version = "0.8.3" }
zeroclaw-providers = { path = "crates/zeroclaw-providers", version = "0.8.3" }
zeroclaw-memory = { path = "crates/zeroclaw-memory", version = "0.8.3" }
zeroclaw-channels = { path = "crates/zeroclaw-channels", version = "0.8.3", default-features = false }
zeroclaw-tools = { path = "crates/zeroclaw-tools", version = "0.8.3", default-features = false }
zeroclaw-sop-graph = { path = "crates/zeroclaw-sop-graph", version = "0.8.3", default-features = false }
zeroclaw-runtime = { path = "crates/zeroclaw-runtime", version = "0.8.3", default-features = false }
zeroclaw-eval = { path = "crates/zeroclaw-eval", version = "0.8.3" }
zeroclaw-gateway = { path = "crates/zeroclaw-gateway", version = "0.8.3", default-features = false }
zeroclaw-gateway-client = { path = "crates/zeroclaw-gateway-client", version = "0.8.3" }
zeroclaw-tool-call-parser = { path = "crates/zeroclaw-tool-call-parser", version = "0.8.3" }
zeroclaw-macros = { path = "crates/zeroclaw-macros", version = "0.8.3" }
directories = "6.0"
sys-locale = "0.3"
zeroclaw-policy = { path = "crates/zeroclaw-policy", version = "0.8.3" }

[package]
name = "zeroclawlabs"
# Workspace crates are publish = false during microkernel transition.
publish = false
default-run = "zeroclaw"
version.workspace = true
edition.workspace = true
authors = ["theonlyhennygod"]
license.workspace = true
description = "Zero overhead. Zero compromise. 100% Rust. The fastest, smallest AI assistant."
repository.workspace = true
readme = "README.md"
keywords = ["ai", "agent", "cli", "assistant", "chatbot"]
categories = ["command-line-utilities", "api-bindings"]
rust-version.workspace = true
include = [
  "/src/**/*",
  "/Cargo.toml",
  "/Cargo.lock",
  "/LICENSE*",
  "/README.md",
  "/web/dist/**/*",
  "/locales/**/*",
]

[[bin]]
name = "zeroclaw"
path = "src/main.rs"

[lib]
name = "zeroclaw"
path = "src/lib.rs"

[dependencies]
zeroclaw-schema-markdown = { workspace = true, optional = true }
zeroclaw-policy.workspace = true
zeroclaw-http.workspace = true
# Internal workspace crates — versions and paths declared once in [workspace.dependencies]
zeroclaw-api.workspace = true
zeroclaw-spawn.workspace = true
zeroclaw-infra.workspace = true
zeroclaw-config = { workspace = true, features = ["clap"] }
zeroclaw-log.workspace = true
zeroclaw-providers.workspace = true
zeroclaw-memory.workspace = true
zeroclaw-channels = { workspace = true, optional = true }
zeroclaw-tools = { workspace = true, optional = true }
zeroclaw-runtime = { workspace = true, optional = true }
zeroclaw-eval = { workspace = true, optional = true }
zeroclaw-gateway = { workspace = true, optional = true }
zeroclaw-gateway-client = { workspace = true, optional = true }
zeroclaw-tool-call-parser.workspace = true
zeroclaw-macros.workspace = true
# CLI - minimal and fast
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap-markdown = "0.1"

# Async runtime - feature-optimized for size
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process", "io-std", "fs", "signal"] }
tokio-util = { version = "0.7", default-features = false }

# HTTP client - minimal features
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "multipart", "stream", "socks"] }

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

# Config
directories = "6.0"
toml = "1.0"

# JSON Schema generation for config export
schemars = "1.2"

# URL encoding for gateway pairing management
urlencoding = "2.1"

# Tarball extraction for binary updates
flate2 = "1"
tar = "0.4"

# Progress bars (update pipeline)
indicatif = "0.18"

# Temp files (update pipeline rollback)
tempfile = "3.26"

# Zip extraction (self-update archives)
zip = { version = "9.0", default-features = false, features = ["deflate-flate2"] }

# Error handling
anyhow = "1.0"

# UUID generation
uuid = { version = "1.22", default-features = false, features = ["v4", "std"] }

# Archive checksum validation (self-update).
sha2 = "0.10"
hex = "0.4"

# Async traits
async-trait = "0.1"

# Memory / persistence (migration.rs, behind agent-runtime)
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

# Interactive CLI prompts (memory CLI uses dialoguer unconditionally)
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
console = "0.16"

# WebSocket client for the `self-test` gateway probe (src/commands/self_test.rs)
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }

# MIME parsing for email attachment integration tests
mail-parser = { version = "0.11.2", optional = true }

# Gateway integration-test fixtures (enabled with the gateway feature).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws", "macros"], optional = true }
tower = { version = "0.5", default-features = false, features = ["util"], optional = true }

# Unix-specific dependencies (for root check, etc.)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Installer/surface metadata: which `[features]` are internal aggregates or
# meta toggles rather than user-selectable rows. This bit is NOT derivable from
# the feature graph (e.g. `embedded-web` and `whatsapp-web` are structurally
# identical single cross-crate refs but one is meta and one is a real row), so
# it lives here in the canonical registry. install.sh and `cargo cmd convert`
# both read this; neither shadows it with its own list.
[package.metadata.zeroclaw]
non_row_features = [
    "default",
    "default-channels",
    "channels-full",
    "slim-control",
    "ci-all",
    "landlock",
    "metrics",
    "embedded-web",
    "voice-surface",
]
# Features intentionally added to the lean Cargo defaults for standard
# distribution artifacts. This list is the complete positive policy beyond
# `default`; target-specific exclusions are resolved from the table below.
dist_extra_features = [
    "channel-matrix",
    "channel-lark",
    "whatsapp-web",
]

# Features whose build needs system C libraries or tooling the minimal static
# container image (StageX, no system package manager) does not provide. Excluded
# from the container kitchen-sink (Selection::All) so the all-features image
# builds; still available via source --features or a nix override. Not derivable
# from the feature graph, so it lives in the canonical registry.
container_excluded_features = [
    "voice-wake",
]

# Compatibility exclusions for standard distribution artifacts. Release
# workflows pass only their target triple; feature policy stays here.
[package.metadata.zeroclaw.dist_target_exclusions]
aarch64-linux-android = ["whatsapp-web"]
arm-unknown-linux-gnueabihf = ["observability-prometheus"]
armv7-unknown-linux-gnueabihf = ["observability-prometheus"]

[features]
default = [
    "agent-runtime",
    "default-channels",
    "gateway",
    "observability-prometheus",
    "schema-export",
    "integrations-saas",
]

# Optional lean control profile. Select with --no-default-features; Cargo
# features are additive, so using it with defaults retains the standard surface.
# ACP server and Webhook ingress, plus WeChat and WeCom channels.
slim-control = [
    "agent-runtime",
    "gateway",
    "channel-acp-server",
    "channel-webhook",
    "channel-wechat",
    "channel-wecom",
    "channel-wecom-ws",
]

# Concrete integration families forwarded from zeroclaw-tools. Default-on so
# the standard build keeps the pre-feature compiled surface and registry; a
# slim companion build selects `--no-default-features --features agent-runtime,...`
# and omits these to keep the families out of the dependency graph. The
# implementations stay in-tree either way — turning a family off is a compile
# selection, not a deletion.
integrations-saas = [
    "zeroclaw-tools/integrations-saas",
    "zeroclaw-runtime/integrations-saas",
]

# The core agent runtime — agent loop, tools, persistence subsystems.
# Without this, you get the kernel: config + providers + memory + CLI chat.
# Channels are opt-in via the lean `default-channels` bundle, `channels-full`,
# or individual `channel-*` features.
agent-runtime = [
    "dep:zeroclaw-runtime", "dep:zeroclaw-eval", "dep:zeroclaw-channels", "dep:zeroclaw-tools",
    "dep:zeroclaw-gateway-client",
    "dep:rusqlite",
    "dep:tokio-tungstenite",
    "dep:rustls",
]

# Lean channel bundle included in `default`. These channels cover local/editor
# ACP, gateway/webhook ingress, and common first-run external chat/email paths.
default-channels = [
    "channel-acp-server", "channel-webhook",
    "channel-email", "channel-telegram", "channel-discord",
]

# Historical broad channel bundle. Preserves the older default channel surface.
channels-full = [
    "default-channels", "zeroclaw-channels/channels-full", "channel-lark",
    "channel-line",
    "channel-slack", "channel-signal",
    "channel-mattermost", "channel-irc", "channel-imessage",
    "channel-dingtalk", "channel-qq", "channel-bluesky", "channel-git",
    "channel-twitch", "channel-twitter", "channel-reddit", "channel-notion", "channel-amqp",
    "channel-mochat", "channel-wecom", "channel-wecom-ws", "channel-clawdtalk",
    "channel-voice-call",
]

# Major subsystems — each forwards to exactly ONE crate
gateway = [
    "dep:zeroclaw-gateway",
    "dep:axum", "dep:tower",
]
schema-export = ["dep:zeroclaw-schema-markdown", "zeroclaw-config/schema-export", "zeroclaw-gateway?/schema-export"]

# Channels — each forwards to zeroclaw-channels.
channel-email = ["zeroclaw-channels/channel-email", "zeroclaw-runtime?/email-tools", "dep:mail-parser"]
channel-telegram = ["zeroclaw-channels/channel-telegram"]
channel-lark = ["zeroclaw-channels/channel-lark"]
channel-nostr = ["zeroclaw-channels/channel-nostr"]
channel-matrix = ["zeroclaw-channels/channel-matrix"]
channel-discord = ["zeroclaw-channels/channel-discord"]
channel-slack = ["zeroclaw-channels/channel-slack"]
channel-signal = ["zeroclaw-channels/channel-signal"]
channel-mattermost = ["zeroclaw-channels/channel-mattermost"]
channel-irc = ["zeroclaw-channels/channel-irc"]
channel-twitch = ["zeroclaw-channels/channel-twitch"]
channel-imessage = ["zeroclaw-channels/channel-imessage"]
channel-dingtalk = ["zeroclaw-channels/channel-dingtalk"]
channel-qq = ["zeroclaw-channels/channel-qq"]
channel-bluesky = ["zeroclaw-channels/channel-bluesky"]
channel-git = ["zeroclaw-channels/channel-git"]
provider-github = ["zeroclaw-channels/provider-github"]
provider-gitea = ["zeroclaw-channels/provider-gitea"]
channel-twitter = ["zeroclaw-channels/channel-twitter"]
channel-reddit = ["zeroclaw-channels/channel-reddit"]
channel-notion = ["zeroclaw-channels/channel-notion"]
channel-amqp = ["zeroclaw-channels/channel-amqp"]
channel-mochat = ["zeroclaw-channels/channel-mochat"]
channel-wechat = ["zeroclaw-channels/channel-wechat", "zeroclaw-gateway?/channel-wechat"]
channel-wecom = ["zeroclaw-channels/channel-wecom"]
channel-wecom-ws = ["zeroclaw-channels/channel-wecom-ws"]
channel-clawdtalk = ["zeroclaw-channels/channel-clawdtalk"]
channel-webhook = ["zeroclaw-channels/channel-webhook"]
channel-acp-server = ["zeroclaw-channels/channel-acp-server"]

# Node discovery surface (gateway `/ws/nodes` registry + LAN mDNS peer hints).
# Default-off, mirroring `zeroclaw-gateway`'s own `nodes` feature. The root
# package needs this forward so targets that construct `gateway::AppState`
# (e.g. the `component` test) can cfg-gate the node-only fields.
nodes = ["zeroclaw-gateway?/nodes"]
channel-voice-call = ["zeroclaw-channels/channel-voice-call"]
channel-line = ["zeroclaw-channels/channel-line"]
# Feishu uses the same channel implementation as Lark; `use_feishu = true`
# selects Feishu endpoints at runtime.
channel-feishu = ["channel-lark"]
whatsapp-web = ["zeroclaw-channels/whatsapp-web", "zeroclaw-gateway?/whatsapp-web"]
voice-wake = ["zeroclaw-channels/voice-wake"]
memory-tachi = ["zeroclaw-memory/tachi"]

# Backends and platform flags — each forwards to ONE crate
observability-prometheus = [
    "zeroclaw-runtime/observability-prometheus",
    "zeroclaw-gateway/observability-prometheus",
]
sandbox-landlock = ["zeroclaw-runtime/sandbox-landlock"]
sandbox-bubblewrap = ["zeroclaw-runtime/sandbox-bubblewrap"]
embedded-web = ["zeroclaw-gateway/embedded-web"]

# Backward-compatible aliases
landlock = ["sandbox-landlock"]
metrics = ["observability-prometheus"]

voice-surface = ["gateway", "zeroclaw-gateway/voice-surface"]

# CI meta-feature
ci-all = [
    "nodes",
    "voice-surface",
    "agent-runtime",
    "channels-full",
    "channel-nostr", "channel-matrix", "whatsapp-web",
    "observability-prometheus",
    "sandbox-landlock", "sandbox-bubblewrap",
    "zeroclaw-channels/heavy-tests",
    "zeroclaw-runtime/heavy-tests",
]

# Keep local debug artifacts small. Repository Cargo config disables incremental
# compilation by default; short edit loops can opt in with CARGO_INCREMENTAL=1.
[profile.dev]
opt-level = 1                 # own code: mild opt, still fast to compile
debug = "line-tables-only"    # keep panic backtraces (file:line), drop the bulk of
                              # debuginfo — the main disk hog on a 1200+ dep tree

# Third-party deps: optimized once and then reused from target/ (no sccache
# or mold is assumed; rust-lld, the toolchain default on x86_64 Linux, links),
# so dev runtime is fast; debug=false drops their debuginfo entirely (you never
# step into deps), which is the real cut to the runaway target size. Reclaim
# disk with scripts/dev/target_sweep.sh, which keeps these and drops only
# workspace crates.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = "z"      # Optimize for size
lto = "fat"          # Maximum cross-crate optimization for smaller binaries
codegen-units = 1    # Serialized codegen for low-memory devices (e.g., Raspberry Pi 3 with 1GB RAM)
                     # Higher values (e.g., 8) compile faster but require more RAM during compilation
strip = true          # Remove debug symbols
panic = "abort"      # Reduce binary size

[profile.release-fast]
inherits = "release"
codegen-units = 8    # Parallel codegen for faster builds on powerful machines (16GB+ RAM recommended)
                     # Use: cargo build --profile release-fast

[profile.ci]
inherits = "release"
lto = "thin"         # Much faster than fat LTO; still catches release-mode issues
codegen-units = 16   # Full parallelism for CI runners

[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
# Used only by root integration-test fixtures and assertions.
parking_lot = "0.12"
regex = "1.10"
tempfile = "3.26"
criterion = { version = "0.8", features = ["async_tokio"] }
wiremock = "0.6"
scopeguard = "1.2"
rcgen = "0.13"

[[test]]
name = "component"
path = "tests/test_component.rs"

[[test]]
name = "integration"
path = "tests/test_integration.rs"

[[test]]
name = "system"
path = "tests/test_system.rs"

# Architecture invariant gates. Fail-on-detect for patterns that
# violate the workspace's ABSOLUTE RULE (AGENTS.md §1) — duplicate
# state across the codebase. Run with `cargo test --test architecture`
# during development; the workspace `cargo test` already includes it.
[[test]]
name = "architecture"
path = "tests/test_architecture.rs"

[[bench]]
name = "agent_benchmarks"
harness = false

[[bin]]
name = "zeroclaw-node-host"
path = "src/bin/zeroclaw-node-host.rs"
required-features = ["gateway", "nodes", "agent-runtime"]

[[test]]
name = "node_v2_process"
required-features = ["gateway", "nodes", "agent-runtime"]
