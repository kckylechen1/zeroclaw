# Static analysis: pattern checks for code/config, deep taint on master+schedule.
#
# Semgrep (code/config PRs and pushes): <60s, no build, catches injection/path-traversal/unsafe
#   patterns. Community rules auto-detected for Rust.
# CodeQL (master push + daily): 10-30 min, inter-procedural taint tracking,
#   SARIF results published to GitHub Security tab.
#
# We deliberately do NOT gate every PR on CodeQL. A 20-minute analysis that
# sometimes times out on Rust is a productivity tax, not a security guarantee.
# Semgrep covers the fast path; CodeQL catches what Semgrep misses.
#
# Semgrep currently runs in report-only mode (no --error). The 43 initial findings
# need triage before making it a required check — tracked as a follow-up.

name: Code Analysis

on:
  pull_request:
    # Same reason as ci.yml: stacked PRs base on a parent branch, not master,
    # so a [master] filter silently skips Semgrep on them entirely.
    branches: ['**']
  push:
    branches: [master]
  schedule:
    - cron: '37 5 * * *'   # daily at 05:37 UTC — random offset to spread load

concurrency:
  # A prose push must not cancel pending/running analysis for an earlier code push.
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' && github.sha) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  changes:
    name: Analysis Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Classify changes (scheduled scans retain full coverage)
        id: scope
        run: python3 scripts/ci/change_scope.py

  # ── Fast pattern analysis (code/config changes, ~1 min) ──────────────

  semgrep:
    name: Semgrep
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep@sha256:06938c1f365d3f67b8cedd8bc117607ae64253f88a0e768e9da9408548927dd6 # 2026-06-17
    if: github.event_name != 'schedule' && needs.changes.outputs.full == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Semgrep CE
        run: semgrep scan --config auto
        env:
          # Suppress telemetry / version-check noise.
          SEMGREP_SEND_TELEMETRY: "off"
          SEMGREP_VERSION_CHECK: "off"

  # ── Deep taint analysis (master push + daily, ~15 min) ────────────────

  codeql:
    name: CodeQL
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    if: |
      github.ref == 'refs/heads/master' &&
      needs.changes.outputs.full == 'true' &&
      (github.event_name == 'push' || github.event_name == 'schedule')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b0c4fd77f6c559021d78430ec4d0d169ae74a4eb # v3
        with:
          languages: rust
          config-file: .github/codeql/codeql-config.yml
      - name: Build
        run: cargo build --locked --workspace --features ci-all
        env:
          CARGO_TERM_COLOR: always
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b0c4fd77f6c559021d78430ec4d0d169ae74a4eb # v3
