name: Memory Migration Portability

on:
  pull_request:
    branches: ['**']
    paths:
      - crates/zeroclaw-memory/src/portable_migration.rs
      - 'crates/zeroclaw-memory/src/portable_migration/**'
      - crates/zeroclaw-memory/Cargo.toml
      - Cargo.lock
      - .github/workflows/memory-migration-portability.yml

permissions:
  contents: read

concurrency:
  group: memory-migration-portability-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0

jobs:
  macos:
    name: macOS migration filesystem regressions
    # #576/#595 require native macOS filesystem semantics. Use the standard
    # Intel macOS 15 pool; the ARM pool can exhaust capacity before tests start.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: memory-migration-macos
      - name: Verify pinned toolchain
        run: bash scripts/ci/toolchain_gate.sh
      - name: Run real migration and sidecar regressions on macOS
        run: cargo test --locked -p zeroclaw-memory --features tachi --lib portable_migration::tests::files
