name: Memory Kernel Qualification

on:
  pull_request:
    branches: ['**']
    paths:
      - scripts/ci/qualify_memory_kernel.py
      - scripts/ci/test_ci_memory_kernel.py
      - scripts/ci/memory-kernel-candidate.txt
      - crates/zeroclaw-memory/tests/portable_kernel_upgrade.rs
      - .github/workflows/memory-kernel-qualification.yml

permissions:
  contents: read

concurrency:
  group: memory-kernel-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  consumer:
    name: Resolve and verify optional kernel candidate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.1
      - name: Check qualification guard fixtures
        run: python3 -m unittest discover -s scripts/ci -p 'test_ci_memory_kernel.py' -v
      - name: Resolve and test a disposable consumer worktree
        shell: bash
        run: |
          set -euo pipefail
          kernel_rev="$(cat scripts/ci/memory-kernel-candidate.txt)"
          python3 scripts/ci/qualify_memory_kernel.py \
            --kernel-rev "$kernel_rev" \
            --output "$RUNNER_TEMP/memory-kernel-qualification"
      - name: Retain resolver output and exact-candidate receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: memory-kernel-qualification
          path: |
            ${{ runner.temp }}/memory-kernel-qualification/candidate.Cargo.lock
            ${{ runner.temp }}/memory-kernel-qualification/candidate.Cargo.toml
            ${{ runner.temp }}/memory-kernel-qualification/qualification.json
            ${{ runner.temp }}/memory-kernel-qualification/*.log
          if-no-files-found: error
          retention-days: 7
